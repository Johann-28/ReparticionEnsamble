name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - develop  # Cambia esto a la rama que desees desplegar

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'  # Asegúrate de usar una versión compatible con tu proyecto

      - name: Install dependencies
        run: npm install

      - name: Build Angular project
        run: npm run build -- --output-path=docs --base-href=/ReparticionEnsamble/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1